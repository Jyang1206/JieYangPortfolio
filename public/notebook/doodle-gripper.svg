<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="#1f4fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Parallel-jaw gripper on a wrist, hand-drawn stroke. Same pen as every doodle: 2.6px, round caps, slight wobble filter. -->
  <filter id="w" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
  <g filter="url(#w)">
    <!-- wrist -->
    <path d="M60 6 C 59 18, 61 24, 60 34"/>
    <path d="M46 34 L 74 34 L 76 52 L 44 52 Z"/>
    <!-- fingers -->
    <path d="M48 52 L 42 72 L 44 98 L 54 98 L 52 72 L 56 52"/>
    <path d="M72 52 L 78 72 L 76 98 L 66 98 L 68 72 L 64 52"/>
    <!-- pads -->
    <path d="M54 80 L 54 96" stroke-width="4" stroke-opacity="0.6"/>
    <path d="M66 80 L 66 96" stroke-width="4" stroke-opacity="0.6"/>
    <!-- the instrument between the fingers -->
    <path d="M60 86 C 60 100, 61 106, 60 114" stroke-width="2"/>
    <!-- motion ticks -->
    <path d="M34 76 L 28 74 M34 84 L 28 86"/>
    <path d="M86 76 L 92 74 M86 84 L 92 86"/>
  </g>
</svg>
