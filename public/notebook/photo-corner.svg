<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Black album photo corner, top-left orientation. Rotate 90/180/270deg for the other corners. -->
  <path d="M0 0 H34 L0 34 Z" fill="#1a1a1a"/>
  <path d="M0 0 H34 L0 34 Z" fill="url(#g)"/>
  <path d="M34 0 L0 34" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/><stop offset="1" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
</svg>
