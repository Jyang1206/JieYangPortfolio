<svg xmlns="http://www.w3.org/2000/svg" width="140" height="100" viewBox="0 0 140 100" fill="none" stroke="#1f4fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Autonomous mobile robot with a lidar sweep, hand-drawn stroke. -->
  <filter id="w" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
  <g filter="url(#w)">
    <!-- chassis -->
    <path d="M22 48 L 108 46 C 114 46, 118 50, 118 56 L 117 70 L 20 72 L 20 55 C 20 51, 20 48, 22 48 Z"/>
    <!-- payload -->
    <path d="M38 46 L 40 28 L 94 27 L 96 46"/>
    <!-- wheels -->
    <circle cx="40" cy="78" r="8"/>
    <circle cx="98" cy="78" r="8"/>
    <circle cx="40" cy="78" r="2" fill="#1f4fff" stroke="none"/>
    <circle cx="98" cy="78" r="2" fill="#1f4fff" stroke="none"/>
    <!-- lidar puck -->
    <path d="M60 27 L 60 18 L 74 18 L 74 27"/>
    <!-- sweep -->
    <path d="M78 20 C 92 18, 104 24, 112 34" stroke-dasharray="4 5"/>
    <path d="M78 14 C 98 10, 116 18, 128 34" stroke-dasharray="4 5" stroke-opacity="0.6"/>
    <!-- floor line -->
    <path d="M6 92 L 134 90" stroke-opacity="0.5"/>
  </g>
</svg>
