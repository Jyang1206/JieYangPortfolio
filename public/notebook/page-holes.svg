      <stop offset="0" stop-color="#121212" stop-opacity="0.9"/>
      <stop offset="0.85" stop-color="#121212" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="20" cy="81" rx="7.5" ry="7.5" fill="#000" fill-opacity="0.18"/>
  <circle cx="20" cy="80" r="7" fill="url(#h)"/>
  <path d="M14.5 77.5 Q17 73.5 21.5 73.6" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
</svg>
