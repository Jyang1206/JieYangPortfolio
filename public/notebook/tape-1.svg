    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="2" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 -1 0.62" result="g"/>
    <feComposite in="g" in2="SourceGraphic" operator="in"/>
  </filter>
  <path id="s" d="M6 9 L12 4 L15 10 L10 14 L14 19 L8 24 L13 29 L9 34 L14 39 L10 44 L212 42 L207 37 L213 31 L208 26 L214 21 L209 16 L215 11 L210 6 L214 2 Z"/>
