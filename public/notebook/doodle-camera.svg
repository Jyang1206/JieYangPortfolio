<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="#1f4fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- RGB-D camera with a viewing cone, hand-drawn stroke. -->
  <filter id="w" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter>
  <g filter="url(#w)">
    <!-- body -->
    <path d="M22 30 L 96 29 C 101 29, 104 32, 104 37 L 103 52 C 103 56, 100 59, 96 59 L 23 60 C 19 60, 16 57, 16 53 L 17 36 C 17 32, 19 30, 22 30 Z"/>
    <!-- lenses: rgb, ir, ir -->
    <circle cx="36" cy="45" r="8"/>
    <circle cx="36" cy="45" r="3" fill="#1f4fff" stroke="none"/>
    <circle cx="64" cy="45" r="5"/>
    <circle cx="86" cy="45" r="5"/>
    <!-- mount -->
    <path d="M60 60 L 60 72 M50 72 L 70 72"/>
    <!-- depth cone -->
    <path d="M34 62 L 14 108" stroke-dasharray="5 5"/>
    <path d="M86 62 L 106 108" stroke-dasharray="5 5"/>
    <path d="M14 108 C 40 100, 80 100, 106 108" stroke-dasharray="5 5"/>
  </g>
</svg>
