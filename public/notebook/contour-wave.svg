<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <!-- Fine wavy contour lines, white, for the arch window's tint layer. Tiles vertically (every path is a translate of one wave). -->
  <g fill="none" stroke="#fff" stroke-width="0.9" stroke-opacity=".55">
    <path id="w" d="M0 10 C 40 2, 70 20, 110 12 S 180 0, 220 12 S 300 24, 340 10 S 390 2, 400 10"/>
    <use href="#w" y="20"/><use href="#w" y="40" x="-12"/><use href="#w" y="60"/><use href="#w" y="80" x="-12"/>
    <use href="#w" y="100"/><use href="#w" y="120" x="-12"/><use href="#w" y="140"/><use href="#w" y="160" x="-12"/><use href="#w" y="180"/>
  </g>
</svg>
